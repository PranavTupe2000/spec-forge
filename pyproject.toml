[project]
name = "spec-forge"
version = "0.1.0"
description = "SpecForge Toolkit — mixed engineering inputs to a validated system IR, a SysML v2 model and a compiling Modelica model, with full provenance."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.scripts]
spec-forge = "spec_forge.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_forge"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic-generated revision boilerplate — regenerated by `alembic revision`, not hand-styled.
"src/spec_forge/persistence/migrations/versions/*.py" = ["ALL"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["spec_forge.core.*", "spec_forge.emit.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["test/unit"]

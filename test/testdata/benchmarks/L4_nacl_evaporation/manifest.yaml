reference_trace:
  path: 09_datasets/10_batch_run_3000s.csv
  duration_s: 3000
  requires_cycle_reset_after_s: 2500

configurations:
  - name: StandardWater
    role: integration_baseline
    compile: required
    simulate: required
    note: Topology and sequence verification baseline, per URS section 3 and DR-07 decision 7.
  - name: WaterNaCl
    role: intended_physical
    compile: required
    simulate: known_issue
    note: >-
      Convergence failure at pump start is a known open issue (A-19). Report honestly as a gap;
      do not claim a working model.

acceptance:
  compile: required
  simulate: required
  simulate_configuration: StandardWater
  stop_time_s: 3000
  structural_coverage_min: 0.80
  required_elements:
    - K1_identifiable_condenser
    - parallel_region_split
    - parallel_region_join
    - junction_volumes

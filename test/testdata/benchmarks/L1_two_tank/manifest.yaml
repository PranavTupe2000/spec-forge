# Case manifest — L1_two_tank
#
# TEST FIXTURE METADATA, NOT PRODUCTION INPUT.
# In production these fields are extracted from document content and this file is absent.
# The manifest exists so ingestion and precedence can be tested independently of extraction
# quality, and so the benchmark suite has a stated ground truth for what each document IS.
#
# Every case MUST also pass with --no-manifest (SF-SCP-02). See 04_ingestion_spec.md section 8.

case_id: L1_two_tank
level: L1
title: "Two-Tank Sequence Controller"
reasoning_under_test: "Sequencing, interlocks, state machines, safe start and stop. No physics coupling."
spec: docs/specifications/benchmarks/L1_two_tank.md

documents:
  - path: 01_requirements/01_customer_URS.pdf
    document_number: URS-001
    revision: A
    status: released
    issued_date: 2026-01-15
    authority_tier: 3
    reliability: high
    caveat: Some values later superseded by CR-004.

  - path: 02_engineering_data/02_engineering_data_register.xlsx
    document_number: REG-TANK
    revision: compiled
    status: released
    issued_date: 2026-04-10
    authority_tier: 4
    reliability: high
    caveat: Contains both current and superseded values; see Operating_Parameters.Effective column.
    precedence_sheets:
      change_log: Change_Log
      source_index: Source_Index
      parameters: Operating_Parameters
      requirements: Requirements_Register
      interfaces: Interface_Matrix

  - path: 03_architecture_diagrams/03_reference_control_diagram.png
    status: released
    authority_tier: 8
    reliability: medium
    modality: image
    caveat: Aliases rather than formal tags.

  - path: 03_architecture_diagrams/11_partial_legacy_architecture.puml
    status: draft
    authority_tier: 8
    reliability: medium
    caveat: >-
      Intentionally incomplete. Its own note states it omits LT-101/LT-102, START/STOP/SHUT
      inputs, the pause state and controlled-shutdown concurrency.

  - path: 04_design_notes/04_control_logic_design_notes.docx
    document_number: CDS-02
    revision: B
    status: released
    issued_date: 2026-02-20
    authority_tier: 3
    reliability: high
    caveat: State semantics authority. CR-004 updates numeric parameters but not state semantics.

  - path: 04_design_notes/06_design_review_minutes.md
    document_number: DR-02
    revision: Final
    status: approved
    issued_date: 2026-02-19
    authority_tier: 2
    reliability: high

  - path: 04_design_notes/12_operator_shift_notes.txt
    status: informal
    issued_date: 2026-04-04
    authority_tier: 10
    reliability: low
    caveat: Uncontrolled test-engineer notes. Observational evidence, not design authority.

  - path: 05_correspondence/05_controls_email_thread.eml
    status: informal
    issued_date: 2026-03-12
    authority_tier: 9
    reliability: medium
    transmits:
      - record: CR-004
        record_status: approved
        effective_date: 2026-03-11
        inherited_tier: 1
    caveat: Per-message splitting required; thread contains both stale and approved values.

  - path: 06_legacy_code/07_legacy_tank_demo.mo
    document_number: SIM-LEGACY
    revision: "1.2"
    status: archived
    issued_date: 2026-02-02
    authority_tier: 11
    reliability: low
    caveat: >-
      Predates CR-004; still carries 0.78 / 10 / 10. Its own comments state SHUT handling was
      not completed. Structural fragments remain useful; parameter fragments are superseded.

  - path: 07_datasheets/08_valve_datasheet.pdf
    document_number: VD-101
    revision: B
    status: released
    authority_tier: 5
    reliability: high

  - path: 08_commissioning/09_test_procedure_TP17.pdf
    document_number: TP-17
    revision: C
    status: released
    issued_date: 2026-04-03
    authority_tier: 6
    reliability: high
    caveat: Verification input, not design authority (stated in the register Change_Log).

  - path: 09_datasets/10_demo_run_900s.csv
    status: released
    authority_tier: 7
    reliability: high
    role: reference_trace
    caveat: Observed behaviour. Evidence of fact, not of intent.

reference_trace:
  path: 09_datasets/10_demo_run_900s.csv
  time_column: time_s
  duration_s: 900
  state_column: controller_state
  events:
    - {t: 20,  command: START}
    - {t: 220, command: STOP}
    - {t: 280, command: START}
    - {t: 650, command: STOP}
    - {t: 700, command: SHUT}

acceptance:
  compile: required
  simulate: required
  stop_time_s: 900
  structural_coverage_min: 0.80
  tolerances:
    tank1_level_m: {max_abs: 0.02}
    tank2_level_m: {max_abs: 0.02}
    controller_state: {max_event_time_delta_s: 1.0}

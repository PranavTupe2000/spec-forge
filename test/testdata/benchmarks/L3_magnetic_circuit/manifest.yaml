  - path: 04_design_notes/13_flux_tube_theory_note.pdf
    status: released
    authority_tier: 5
    reliability: high

  - path: 04_design_notes/15_engineer_scratch_notes.txt
    status: informal
    authority_tier: 10
    reliability: low
    caveat: Header reads "Engineer scratchpad - uncontrolled".

  - path: 05_correspondence/05_magnetics_email_thread.eml
    status: informal
    issued_date: 2026-02-26
    authority_tier: 9
    reliability: medium
    transmits:
      - record: CR-MAG-004
        record_status: approved
        inherited_tier: 1
      - record: CR-MAG-006
        record_status: approved
        effective_date: 2026-02-26
        inherited_tier: 1

  - path: 06_legacy_code/07_legacy_magnetic_circuit.mo

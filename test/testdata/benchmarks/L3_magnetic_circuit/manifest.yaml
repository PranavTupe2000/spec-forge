acceptance:
  compile: required
  simulate: optional
  verification: analytic
  structural_coverage_min: 0.80
  required_elements:
    - leakage_branch
    - electric_ground
    - magnetic_ground
  tolerances:
    flux_wb: {rel: 0.02}
    flux_density_t: {rel: 0.02}
    induced_voltage_v: {rel: 0.02}

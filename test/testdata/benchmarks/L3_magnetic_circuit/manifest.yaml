# Case manifest — L3_magnetic_circuit
#
# TEST FIXTURE METADATA, NOT PRODUCTION INPUT.
# In production these fields are extracted from document content and this file is absent.
# The manifest exists so ingestion and precedence can be tested independently of extraction
# quality, and so the benchmark suite has a stated ground truth for what each document IS.
#
# Every case MUST also pass with --no-manifest (SF-SCP-02). See 04_ingestion_spec.md section 8.

case_id: L3_magnetic_circuit
level: L3
title: "Quasi-Static Magnetic Circuit"
reasoning_under_test: "Multiphysics energy transfer across domains, with an explicit loss path."
spec: docs/specifications/benchmarks/L3_magnetic_circuit.md

documents:
  - path: 01_requirements/01_system_requirement_specification.pdf
    document_number: SRS-MAG
    revision: A
    status: released
    authority_tier: 3
    reliability: high
    caveat: Parameter values in later approved change records override conflicting values here.

  - path: 02_engineering_data/02_magnetic_engineering_register.xlsx
    document_number: REG-MAG
    revision: compiled
    status: released
    authority_tier: 4
    reliability: high

  - path: 03_architecture_diagrams/03_reference_magnetic_circuit.png
    status: released
    authority_tier: 8
    reliability: medium
    modality: image

  - path: 03_architecture_diagrams/11_partial_magnetic_architecture.puml
    status: draft
    authority_tier: 8
    reliability: medium

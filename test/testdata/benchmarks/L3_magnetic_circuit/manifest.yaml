  - path: 08_commissioning/09_analytic_verification_procedure.pdf
    document_number: AV-11
    status: released
    authority_tier: 6
    reliability: high
    caveat: Verification input, not design authority.

  - path: 08_commissioning/14_lab_validation_runbook.docx
    status: released
    authority_tier: 6
    reliability: high
